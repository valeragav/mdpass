[workspace]
resolver = "3"
members = ["src-tauri", "crates/mdpass-core"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
