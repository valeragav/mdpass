[package]
name = "mdpass"
version.workspace = true
description = "Менеджер паролей в зашифрованном Markdown-файле"
authors = ["valeragav"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdpass-core = { path = "../crates/mdpass-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
zeroize = "1"
age = "0.12.1"
tauri-plugin-log = "2"
log = "0.4"
mdpass-cloud = { path = "../crates/mdpass-cloud" }

# Буфер обмена на компьютерах. На телефонах — плагин Tauri, ниже.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6", default-features = false }
# Токены облаков на компьютерах — в системном хранилище паролей: Диспетчер учётных
# данных Windows, Связка ключей macOS, Secret Service в Linux. На телефоне — файл.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Буфер обмена на телефонах. Плагин fs читает и пишет файлы, выбранные в системном
# диалоге: Android отдаёт вместо пути адрес content://.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
tempfile = "3.27.0"

# Под Wayland буфер обмена работает через протокол data-control, без него arboard видит только X11.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
