[package]
name = "mdpass"
version.workspace = true
description = "Менеджер паролей в зашифрованном Markdown-файле"
authors = ["valeragav"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdpass-core = { path = "../crates/mdpass-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
zeroize = "1"
age = "0.12.1"
tauri-plugin-log = "2"
log = "0.4"

# Буфер обмена на компьютерах. На телефонах появится вместе с мобильной сборкой.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

# Под Wayland буфер обмена работает через протокол data-control, без него arboard видит только X11.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
