[package]
name = "mdpass-core"
version.workspace = true
edition.workspace = true
description = "Ядро mdpass: формат хранилища, шифрование, резервные копии"

[dependencies]
age = "0.12.1"
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
