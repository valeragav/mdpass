name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Выпуск запускает эти же проверки и собирает установщики, только если они прошли.
  workflow_call:

# Проверкам хватает чтения. Внешние действия закреплены на коммитах: тег могут
# перевесить на другой код.
permissions:
  contents: read

jobs:
  check:
    name: Тесты и проверки (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Системные библиотеки для Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tauri встраивает собранный интерфейс в бинарник, поэтому dist нужен до cargo.
      - name: Интерфейс и проверка типов
        run: npm run build

      - name: Формат кода
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit

      # Падает на уязвимостях. Предупреждения о заброшенных крейтах только выводятся:
      # оба известных идут из Linux-зависимостей Tauri (GTK).
      - name: cargo audit
        run: cargo audit

  ui:
    name: Тесты интерфейса
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Браузер для тестов
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:ui
