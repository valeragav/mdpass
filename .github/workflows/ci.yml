name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Тесты и проверки (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки для Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tauri встраивает собранный интерфейс в бинарник, поэтому dist нужен до cargo.
      - name: Интерфейс и проверка типов
        run: npm run build

      - name: Формат кода
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

  audit:
    name: Аудит зависимостей
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Падает на уязвимостях. Предупреждения о заброшенных крейтах только выводятся:
      # оба известных идут из Linux-зависимостей Tauri (GTK).
      - name: cargo audit
        run: cargo audit

  ui:
    name: Тесты интерфейса
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Браузер для тестов
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:ui
