# Выпуск по тегу v*: проверка версии и описание → установщики для всех систем → черновик
# выпуска на GitHub.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Версия в теге должна совпадать с package.json, Cargo.toml и src-tauri/tauri.conf.json,
# а в CHANGELOG.md должен быть раздел «## 0.1.0 — …»: его текст становится описанием выпуска.

name: Release

on:
  push:
    tags: ["v*"]

# Писать (создавать черновик выпуска) может только сборка, остальным хватает чтения.
permissions:
  contents: read

jobs:
  ci:
    name: Проверки
    uses: ./.github/workflows/ci.yml

  notes:
    name: Версия и описание
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Версия тега = package.json, Cargo.toml, tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::тег $GITHUB_REF_NAME, а в файлах: package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"
              exit 1
            fi
          done

      - name: Описание из CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # раздел от «## <версия>» до следующего «## »
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::в CHANGELOG.md нет раздела ## $version"
            exit 1
          fi
          cat >> notes.md <<EOF

          ### Установка

          | Система | Файл |
          | --- | --- |
          | Windows | \`mdpass_${version}_x64-setup.exe\` |
          | macOS Apple Silicon | \`mdpass_${version}_aarch64.dmg\` |
          | macOS Intel | \`mdpass_${version}_x64.dmg\` |
          | Linux | \`.AppImage\`, \`.deb\` или \`.rpm\` |
          | Android | \`mdpass_${version}_android.apk\` |

          Установщики пока не подписаны. Windows покажет «Неизвестный издатель»: нажмите
          «Подробнее» → «Выполнить в любом случае». В macOS откройте приложение через
          контекстное меню → «Открыть». На Android разрешите установку из браузера или
          файлового менеджера, через который открыт APK. Подробнее — в [docs/setup.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/setup.md#установка).
          EOF
          {
            echo "body<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Сборка (${{ matrix.name }})
    # Установщики собираются, только если тесты и проверки этого коммита прошли.
    needs: [notes, ci]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Системные библиотеки для Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mdpass ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Сборка (Android)
    # APK добавляется в черновик выпуска, который создают сборки для компьютеров.
    needs: [notes, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ключ подписи — из секретов: ANDROID_KEYSTORE (файл .jks в base64),
      # ANDROID_KEYSTORE_PASSWORD и ANDROID_KEY_ALIAS. Обновление ставится поверх
      # прежней версии, только если ключ тот же.
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::нет секрета ANDROID_KEYSTORE: APK без подписи не установится"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "password=$PASSWORD"
            echo "keyAlias=$ALIAS"
          } > src-tauri/gen/android/keystore.properties

      # Android SDK и NDK уже есть на машине сборки; Gradle нужна Java 17 или новее.
      - name: APK
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri android build -- --apk --target aarch64 armv7 x86_64

      - name: APK в черновик выпуска
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="mdpass_${version}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
